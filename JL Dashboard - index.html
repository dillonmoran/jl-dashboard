<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JL Setters — KPI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f8f6;color:#1a1a18;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:1.5rem 1.25rem}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:18px;font-weight:600;color:#1a1a18}.topbar h1 span{color:#7c6ef7}
.badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500}
.badge.live{background:#d4edda;color:#1a7a4a}.badge.err{background:#fde8e8;color:#c0392b}.badge.loading{background:#ebebeb;color:#888}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.refresh-btn{font-size:11px;padding:4px 12px;border:1px solid #ddd;border-radius:8px;cursor:pointer;background:#fff;color:#555}
.refresh-btn:hover{background:#f0f0f0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:5px 12px;font-size:12px;border:1px solid #ddd;border-radius:8px;cursor:pointer;background:#fff;color:#666;font-weight:500}
.tab.active{background:#1a1a18;color:#fff;border-color:#1a1a18}
.row2{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;align-items:center}
.vtabs{display:flex;gap:4px;flex-wrap:wrap}
.vtab{padding:6px 16px;font-size:12px;border:1px solid #ddd;border-radius:8px;cursor:pointer;background:#fff;color:#666;font-weight:500}
.vtab.active{border-color:#1a1a18;color:#1a1a18}
.vsep{width:1px;height:24px;background:#e0e0e0}
.slabel{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#aaa;margin-bottom:8px}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1.25rem}
.kcard{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #ebebeb}
.klabel{font-size:11px;color:#888;margin-bottom:4px}
.kval{font-size:22px;font-weight:600;color:#1a1a18;display:flex;align-items:center;gap:6px}
.kval.red{color:#c0392b}.kval.amber{color:#d68910}.kval.green{color:#1a7a4a}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.dot.red{background:#e74c3c}.dot.amber{background:#f39c12}.dot.green{background:#27ae60}
.hr{border:none;border-top:1px solid #ebebeb;margin:1.25rem 0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem}
.acard{background:#fff;border:1px solid #ebebeb;border-radius:12px;padding:1rem 1.125rem}
.atitle{font-size:13px;font-weight:600;color:#1a1a18;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #ebebeb;padding-left:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:12px;border-bottom:1px solid #f5f5f5}
.srow:last-child{border-bottom:none}
.sn{color:#888}.sv{font-weight:600;color:#1a1a18;display:flex;align-items:center;gap:4px}
.sv.red{color:#c0392b}.sv.amber{color:#d68910}.sv.green{color:#1a7a4a}
.leg{display:flex;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:4px;font-size:11px;color:#888}
.ls{width:10px;height:10px;border-radius:2px}
.nodata{font-size:13px;color:#aaa;padding:3rem 0;text-align:center;line-height:2}
.spinner{display:flex;align-items:center;justify-content:center;padding:4rem 0;color:#aaa;font-size:13px}
.last-updated{font-size:11px;color:#aaa;margin-top:1.5rem;text-align:right}
select{font-size:12px;padding:4px 8px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a18;cursor:pointer}
@media(max-width:520px){.twocol{grid-template-columns:1fr}.topbar{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <h1>JL Setters — <span>Live Dashboard</span></h1>
      <span class="badge loading" id="statusBadge">Connecting...</span>
    </div>
    <div class="controls">
      <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
      <div class="tabs" id="periodTabs"></div>
    </div>
  </div>
  <div class="row2" id="row2">
    <div class="vtabs" id="viewTabs">
      <div class="vtab active" data-v="combined">Combined</div>
      <div class="vtab" data-v="jack">Jack</div>
      <div class="vtab" data-v="lewis">Lewis</div>
      <div class="vtab" data-v="closing">B2C Closing</div>
    </div>
  </div>
  <div id="main"><div class="spinner">Loading live data...</div></div>
  <div class="last-updated" id="lastUpdated"></div>
</div>
<script>
const APPS_SCRIPT_URL='https://script.google.com/macros/s/AKfycbzbAoesGTEkJVjCfXflD61Veg0sEEb7aYNf-kW4xHA0qXn4d5zTb0f_ol-HjY00r3qvug/exec';
const JACK_NAMES=['jack glover','ollie sykes'];
const LEWIS_NAMES=['lewis sheehy','harry tasch'];
const COLS={submitter:1,date:2,follows:3,inbLeads:4,qls:5,dms:6,convos:7,unqAppt:8,qlAppt:9,callsTaken:10,callsClosed:11,cashCollected:12,revenue:13};
let allRows=[],period='Month',view='combined',selMonth=null,selDay=null;
const PERIODS=['Day','Month','3M','6M','9M','12M'];
function n(v){if(v===null||v===undefined||v===''||v==='-'||v==='null')return null;const f=parseFloat(String(v).replace(/[£,]/g,''));return isNaN(f)?null:f;}
function fmt(v,t){if(v===null||v===undefined||isNaN(v))return'—';if(t==='pct')return v.toFixed(1)+'%';if(t==='gbp')return'£'+Math.round(v).toLocaleString('en-GB');return Math.round(v).toLocaleString();}
function rag(v,m){const r={dmConvo:{r:3,a:8},convToCall:{r:2,a:5},showPct:{r:65,a:80},closePct:{r:35,a:50}};if(!r[m]||v===null||v===undefined)return'';if(v<r[m].r)return'red';if(v<r[m].a)return'amber';return'green';}
function dot(v,m){const r=rag(v,m);if(!r)return'';return`<span class="dot ${r}"></span>`;}
function isJack(s){return JACK_NAMES.some(x=>s.toLowerCase().includes(x.split(' ')[0].toLowerCase()));}
function isLewis(s){return LEWIS_NAMES.some(x=>s.toLowerCase().includes(x.split(' ')[0].toLowerCase()));}
function parseRows(rows){
  return rows.slice(1).map(r=>{
    const sub=String(r[COLS.submitter]||'');
    let dateStr=null;
    const dateRaw=r[COLS.date];
    if(dateRaw){
      const s=String(dateRaw);
      const slash=s.split('/');
      if(slash.length===3){const yr=slash[2].split(' ')[0];dateStr=`${yr.length===2?'20'+yr:yr}-${slash[0].padStart(2,'0')}-${slash[1].padStart(2,'0')}`;}
      if(!dateStr&&s.match(/^\d{4}-\d{2}-\d{2}/))dateStr=s.slice(0,10);
      if(!dateStr){try{const d=new Date(s);if(!isNaN(d))dateStr=d.toISOString().slice(0,10);}catch(e){}}
    }
    return{submitter:sub,date:dateStr,month:dateStr?dateStr.slice(0,7):null,isJack:isJack(sub),isLewis:isLewis(sub),
      follows:n(r[COLS.follows]),inbLeads:n(r[COLS.inbLeads]),qls:n(r[COLS.qls]),dms:n(r[COLS.dms]),convos:n(r[COLS.convos]),
      unqAppt:n(r[COLS.unqAppt]),qlAppt:n(r[COLS.qlAppt]),callsTaken:n(r[COLS.callsTaken]),callsClosed:n(r[COLS.callsClosed]),
      cashCollected:n(r[COLS.cashCollected]),revenue:n(r[COLS.revenue])};
  }).filter(r=>r.date);
}
function calcKPIs(rows,who){
  const f=who==='both'?rows:rows.filter(r=>who==='jack'?r.isJack:r.isLewis);
  const sum=k=>f.reduce((a,r)=>a+(r[k]||0),0);
  const follows=sum('follows'),inbLeads=sum('inbLeads'),qls=sum('qls'),dms=sum('dms'),convos=sum('convos'),unqAppt=sum('unqAppt'),qlAppt=sum('qlAppt');
  const dmConvo=dms>0?(convos/dms)*100:null,totalBooked=unqAppt+qlAppt;
  const cr=rows.filter(r=>r.isJack||r.isLewis);
  const callsTaken=cr.reduce((a,r)=>a+(r.callsTaken||0),0),callsClosed=cr.reduce((a,r)=>a+(r.callsClosed||0),0);
  const cashCollected=cr.reduce((a,r)=>a+(r.cashCollected||0),0),revenue=cr.reduce((a,r)=>a+(r.revenue||0),0);
  const showPct=totalBooked>0?(callsTaken/totalBooked)*100:null,convToCall=convos>0?(callsTaken/convos)*100:null,closePct=callsTaken>0?(callsClosed/callsTaken)*100:null;
  return{follows,inbLeads,qls,dms,convos,unqAppt,qlAppt,dmConvo,convToCall,callsTaken,callsClosed,cashCollected,revenue,showPct,closePct,totalBooked};
}
function getMonths(){return[...new Set(allRows.map(r=>r.month).filter(Boolean))].sort();}
function getMonthsForPeriod(){const all=getMonths();if(!all.length)return[];if(period==='Month')return selMonth?[selMonth]:[all[all.length-1]];const cnt=period==='3M'?3:period==='6M'?6:period==='9M'?9:12;return all.slice(-cnt);}
function rowsForPeriod(){const ms=getMonthsForPeriod();return allRows.filter(r=>ms.includes(r.month));}
function acctHTML(label,k,color){
  return`<div class="acard"><div class="atitle" style="border-left:3px solid ${color}">${label}</div>
    <div class="srow"><span class="sn">Follows</span><span class="sv">${fmt(k.follows)}</span></div>
    <div class="srow"><span class="sn">INB Leads</span><span class="sv">${fmt(k.inbLeads)}</span></div>
    <div class="srow"><span class="sn">QLs</span><span class="sv">${fmt(k.qls)}</span></div>
    <div class="srow"><span class="sn">DMs</span><span class="sv">${fmt(k.dms)}</span></div>
    <div class="srow"><span class="sn">DM → Convo %</span><span class="sv ${rag(k.dmConvo,'dmConvo')}">${fmt(k.dmConvo,'pct')}${dot(k.dmConvo,'dmConvo')}</span></div>
    <div class="srow"><span class="sn">Convos</span><span class="sv">${fmt(k.convos)}</span></div>
    <div class="srow"><span class="sn">Convo → Call %</span><span class="sv ${rag(k.convToCall,'convToCall')}">${fmt(k.convToCall,'pct')}${dot(k.convToCall,'convToCall')}</span></div>
    <div class="srow"><span class="sn">Unq Appt Set</span><span class="sv">${fmt(k.unqAppt)}</span></div>
    <div class="srow"><span class="sn">QL Appt Set</span><span class="sv">${fmt(k.qlAppt)}</span></div>
  </div>`;
}
function closingHTML(k){
  return`<div class="acard" style="margin-bottom:1.25rem"><div class="atitle" style="border-left:3px solid #7c6ef7">B2C Closing — combined</div>
    <div class="kgrid" style="margin-bottom:0">
      <div class="kcard"><div class="klabel">Call Show %</div><div class="kval ${rag(k.showPct,'showPct')}">${fmt(k.showPct,'pct')}${dot(k.showPct,'showPct')}</div></div>
      <div class="kcard"><div class="klabel">Calls Taken</div><div class="kval">${fmt(k.callsTaken)}</div></div>
      <div class="kcard"><div class="klabel">Close %</div><div class="kval ${rag(k.closePct,'closePct')}">${fmt(k.closePct,'pct')}${dot(k.closePct,'closePct')}</div></div>
      <div class="kcard"><div class="klabel">Calls Closed</div><div class="kval">${fmt(k.callsClosed)}</div></div>
      <div class="kcard"><div class="klabel">Cash Collected</div><div class="kval">${fmt(k.cashCollected,'gbp')}</div></div>
      <div class="kcard"><div class="klabel">Revenue</div><div class="kval">${fmt(k.revenue,'gbp')}</div></div>
    </div>
  </div>`;
}
function renderChart(id,labels,datasets){setTimeout(()=>{const ex=Chart.getChart(id);if(ex)ex.destroy();const el=document.getElementById(id);if(!el)return;new Chart(el,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.isCurrency?'£'+ctx.parsed.y.toLocaleString():ctx.parsed.y}}},scales:{y:{ticks:{callback:v=>datasets[0]?.isCurrency?'£'+v.toLocaleString():v,font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}},x:{ticks:{font:{size:10}},grid:{display:false}}}}});},60);}
function renderMain(){
  const main=document.getElementById('main');
  if(!allRows.length){main.innerHTML=`<div class="nodata">No form submissions yet.<br>Once Ollie, Harry, Jack and Lewis start submitting,<br>data will appear here automatically.</div>`;return;}
  const rows=rowsForPeriod();
  if(!rows.length){main.innerHTML=`<div class="nodata">No data for this period yet.</div>`;return;}
  if(period==='Day'){
    const dayRows=allRows.filter(r=>r.date===selDay);
    if(!dayRows.length){main.innerHTML=`<div class="nodata">No submissions for this date yet.</div>`;return;}
    const dj=calcKPIs(dayRows,'jack'),dl=calcKPIs(dayRows,'lewis'),da=calcKPIs(dayRows,'both');
    const dt=new Date(selDay+'T12:00:00');
    const dlabel=dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(view==='combined'){main.innerHTML=`<p class="slabel">${dlabel} — combined</p><div class="kgrid"><div class="kcard"><div class="klabel">Follows</div><div class="kval">${fmt((dj.follows||0)+(dl.follows||0))}</div></div><div class="kcard"><div class="klabel">DMs</div><div class="kval">${fmt((dj.dms||0)+(dl.dms||0))}</div></div><div class="kcard"><div class="klabel">Convos</div><div class="kval">${fmt((dj.convos||0)+(dl.convos||0))}</div></div><div class="kcard"><div class="klabel">Revenue</div><div class="kval">${fmt(da.revenue,'gbp')}</div></div><div class="kcard"><div class="klabel">Cash Collected</div><div class="kval">${fmt(da.cashCollected,'gbp')}</div></div><div class="kcard"><div class="klabel">Calls Closed</div><div class="kval">${fmt(da.callsClosed)}</div></div></div><hr class="hr"><p class="slabel">By account</p><div class="twocol">${acctHTML("Jack",dj,'#378ADD')}${acctHTML("Lewis",dl,'#1D9E75')}</div><hr class="hr">${closingHTML(da)}`;}
    else if(view==='jack'){main.innerHTML=`<p class="slabel">${dlabel} — Jack</p><div class="twocol">${acctHTML("Jack",dj,'#378ADD')}<div></div></div>`;}
    else if(view==='lewis'){main.innerHTML=`<p class="slabel">${dlabel} — Lewis</p><div class="twocol">${acctHTML("Lewis",dl,'#1D9E75')}<div></div></div>`;}
    else{main.innerHTML=`<p class="slabel">${dlabel} — B2C Closing</p>${closingHTML(da)}`;}
    return;
  }
  const jack=calcKPIs(rows,'jack'),lewis=calcKPIs(rows,'lewis'),all=calcKPIs(rows,'both');
  const months=getMonthsForPeriod();
  const mLabel=m=>new Date(m+'-15').toLocaleString('en-GB',{month:'short',year:'numeric'});
  const periodLabel=months.length===1?mLabel(months[0]):mLabel(months[0])+' – '+mLabel(months[months.length-1]);
  if(view==='combined'){
    const totDms=(jack.dms||0)+(lewis.dms||0),totConvos=(jack.convos||0)+(lewis.convos||0);
    const combinedDmC=totDms>0?(totConvos/totDms)*100:null;
    main.innerHTML=`<p class="slabel">${periodLabel} — combined</p><div class="kgrid"><div class="kcard"><div class="klabel">Total Follows</div><div class="kval">${fmt((jack.follows||0)+(lewis.follows||0))}</div></div><div class="kcard"><div class="klabel">Total DMs</div><div class="kval">${fmt(totDms)}</div></div><div class="kcard"><div class="klabel">Convos Started</div><div class="kval">${fmt(totConvos)}</div></div><div class="kcard"><div class="klabel">DM → Convo %</div><div class="kval ${rag(combinedDmC,'dmConvo')}">${fmt(combinedDmC,'pct')}${dot(combinedDmC,'dmConvo')}</div></div><div class="kcard"><div class="klabel">Revenue</div><div class="kval">${fmt(all.revenue,'gbp')}</div></div><div class="kcard"><div class="klabel">Cash Collected</div><div class="kval">${fmt(all.cashCollected,'gbp')}</div></div><div class="kcard"><div class="klabel">Calls Closed</div><div class="kval">${fmt(all.callsClosed)}</div></div><div class="kcard"><div class="klabel">Close %</div><div class="kval ${rag(all.closePct,'closePct')}">${fmt(all.closePct,'pct')}${dot(all.closePct,'closePct')}</div></div></div><hr class="hr"><p class="slabel">By account</p><div class="twocol">${acctHTML("Jack",jack,'#378ADD')}${acctHTML("Lewis",lewis,'#1D9E75')}</div><hr class="hr">${closingHTML(all)}${months.length>1?`<p class="slabel">Monthly revenue trend</p><div class="leg"><span class="li"><span class="ls" style="background:#7c6ef7"></span>Revenue</span><span class="li"><span class="ls" style="background:#1D9E75"></span>Cash collected</span></div><div style="position:relative;height:200px;margin-bottom:1.5rem"><canvas id="trendC"></canvas></div>`:''}`;
    if(months.length>1){const rev=months.map(m=>allRows.filter(r=>r.month===m).reduce((a,r)=>a+(r.revenue||0),0));const cash=months.map(m=>allRows.filter(r=>r.month===m).reduce((a,r)=>a+(r.cashCollected||0),0));renderChart('trendC',months.map(m=>new Date(m+'-15').toLocaleString('en-GB',{month:'short'})),[{label:'Revenue',data:rev,borderColor:'#7c6ef7',backgroundColor:'rgba(124,110,247,0.06)',tension:0.3,pointRadius:3,borderWidth:2,isCurrency:true},{label:'Cash',data:cash,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.06)',tension:0.3,pointRadius:3,borderWidth:2,borderDash:[4,3],isCurrency:true}]);}
  }else if(view==='jack'){main.innerHTML=`<p class="slabel">${periodLabel} — Jack</p><div class="twocol">${acctHTML("Jack's account",jack,'#378ADD')}<div></div></div>`;}
  else if(view==='lewis'){main.innerHTML=`<p class="slabel">${periodLabel} — Lewis</p><div class="twocol">${acctHTML("Lewis's account",lewis,'#1D9E75')}<div></div></div>`;}
  else{main.innerHTML=`<p class="slabel">${periodLabel} — B2C Closing</p>${closingHTML(all)}`;}
}
function buildControls(){
  const ptab=document.getElementById('periodTabs');ptab.innerHTML='';
  PERIODS.forEach(p=>{const t=document.createElement('div');t.className='tab'+(p===period?' active':'');t.textContent=p;t.onclick=()=>{period=p;document.querySelectorAll('#periodTabs .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');updateSecondaryControls();renderMain();};ptab.appendChild(t);});
  document.querySelectorAll('.vtab').forEach(t=>{t.onclick=()=>{view=t.dataset.v;document.querySelectorAll('.vtab').forEach(x=>x.classList.remove('active'));t.classList.add('active');renderMain();};});
  updateSecondaryControls();
}
function updateSecondaryControls(){
  document.getElementById('monthCtrlWrap')?.remove();document.getElementById('dayCtrlWrap')?.remove();
  const months=getMonths();if(!selMonth&&months.length)selMonth=months[months.length-1];
  if(period==='Month'||period==='Day'){
    const wrap=document.createElement('div');wrap.id='monthCtrlWrap';wrap.style.cssText='display:flex;gap:4px;align-items:center';
    const s=document.createElement('div');s.className='vsep';s.style.margin='0 4px';wrap.appendChild(s);
    months.forEach(m=>{const label=new Date(m+'-15').toLocaleString('en-GB',{month:'short',year:'2-digit'});const t=document.createElement('div');t.className='tab'+(m===selMonth?' active':'');t.style.fontSize='11px';t.textContent=label;t.onclick=()=>{selMonth=m;document.querySelectorAll('#monthCtrlWrap .tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');if(period==='Day')buildDaySelector();renderMain();};wrap.appendChild(t);});
    document.getElementById('row2').appendChild(wrap);
  }
  if(period==='Day')buildDaySelector();
}
function buildDaySelector(){
  document.getElementById('dayCtrlWrap')?.remove();
  const days=[...new Set(allRows.filter(r=>r.month===selMonth).map(r=>r.date))].sort();
  if(!days.length)return;if(!selDay||!days.includes(selDay))selDay=days[days.length-1];
  const wrap=document.createElement('div');wrap.id='dayCtrlWrap';wrap.style.cssText='display:flex;gap:6px;align-items:center';
  const s=document.createElement('div');s.className='vsep';s.style.margin='0 4px';
  const lbl=document.createElement('span');lbl.style.cssText='font-size:12px;color:#888';lbl.textContent='Date:';
  const sel=document.createElement('select');
  days.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});if(d===selDay)o.selected=true;sel.appendChild(o);});
  sel.onchange=e=>{selDay=e.target.value;renderMain();};
  wrap.appendChild(s);wrap.appendChild(lbl);wrap.appendChild(sel);document.getElementById('row2').appendChild(wrap);
}
async function loadData(){
  const badge=document.getElementById('statusBadge');
  badge.textContent='Loading...';badge.className='badge loading';
  document.getElementById('main').innerHTML='<div class="spinner">Fetching latest data...</div>';
  try{
    const data=await new Promise((resolve,reject)=>{
      const cbName='_jlcb_'+Date.now();
      const script=document.createElement('script');
      const timer=setTimeout(()=>{delete window[cbName];document.body.removeChild(script);reject(new Error('Timeout'));},15000);
      window[cbName]=(d)=>{clearTimeout(timer);delete window[cbName];document.body.removeChild(script);resolve(d);};
      script.src=APPS_SCRIPT_URL+'?callback='+cbName;
      script.onerror=()=>{clearTimeout(timer);delete window[cbName];reject(new Error('Script load failed'));};
      document.body.appendChild(script);
    });
    allRows=parseRows(data);
    const months=getMonths();if(months.length&&!selMonth)selMonth=months[months.length-1];
    badge.textContent=`Live — ${allRows.length} submission${allRows.length===1?'':'s'}`;badge.className='badge live';
    document.getElementById('lastUpdated').textContent='Last refreshed: '+new Date().toLocaleTimeString('en-GB');
    buildControls();renderMain();
  }catch(e){
    console.error(e);badge.textContent='Connection error';badge.className='badge err';
    document.getElementById('main').innerHTML=`<div class="nodata">Could not connect to data source.<br>Make sure you're online and try refreshing.<br><small style="color:#ccc">${e.message}</small></div>`;
  }
}
loadData();
</script>
</body>
</html>
