</div>

<script>
const SHEET_ID = '1U0RvCd2ckuwBQDiPzCBTQ6VJW7ulwYKOjLlhHiCx6dM';
const SHEET_NAME = 'Daily Submissions';
// Use allorigins proxy to bypass CORS
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}&headers=1`;
const PROXY_URL = `https://api.allorigins.win/get?url=${encodeURIComponent(SHEET_URL)}`;

const JACK_NAMES = ['jack glover','ollie sykes'];
const LEWIS_NAMES = ['lewis sheehy','harry tasch'];

const COLS = {submitter:1,date:2,follows:3,inbLeads:4,qls:5,dms:6,convos:7,unqAppt:8,qlAppt:9,callsTaken:10,callsClosed:11,cashCollected:12,revenue:13};

let allRows = [], period = 'Month', view = 'combined', selMonth = null, selDay = null;
const PERIODS = ['Day','Month','3M','6M','9M','12M'];

function n(v){if(v===null||v===undefined||v===''||v==='-'||v==='null')return null;const f=parseFloat(String(v).replace(/[£,]/g,''));return isNaN(f)?null:f;}
function fmt(v,t){
  if(v===null||v===undefined||isNaN(v))return'—';
  if(t==='pct')return v.toFixed(1)+'%';
  if(t==='gbp')return'£'+Math.round(v).toLocaleString('en-GB');
  return Math.round(v).toLocaleString();
}
function rag(v,m){
  const r={dmConvo:{r:3,a:8},convToCall:{r:2,a:5},showPct:{r:65,a:80},closePct:{r:35,a:50}};
  if(!r[m]||v===null||v===undefined)return'';
  if(v<r[m].r)return'red';if(v<r[m].a)return'amber';return'green';
}
function dot(v,m){const r=rag(v,m);if(!r)return'';return`<span class="dot ${r}"></span>`;}
function isJack(s){return JACK_NAMES.some(x=>s.toLowerCase().includes(x.split(' ')[0].toLowerCase()));}
function isLewis(s){return LEWIS_NAMES.some(x=>s.toLowerCase().includes(x.split(' ')[0].toLowerCase()));}

function parseCSV(text){
  const lines=text.trim().split('\n');
  return lines.slice(1).map(line=>{
    const fields=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'&&!inQ)inQ=true;
      else if(c==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;}
      else if(c==='"'&&inQ)inQ=false;
      else if(c===','&&!inQ){fields.push(cur.trim());cur='';}
      else cur+=c;
    }
    fields.push(cur.trim());
    return fields.map(f=>f.replace(/^"|"$/g,'')||null);
  }).filter(r=>r.some(v=>v&&v!=='null'));
}

function parseRows(rows){
  return rows.map(r=>{
    const sub=(r[COLS.submitter]||'').replace(/^"|"$/g,'');
    const dateRaw=(r[COLS.date]||'').replace(/^"|"$/g,'');
    let dateStr=null;
    if(dateRaw){
      // Try various date formats
      const d1=new Date(dateRaw);
      if(!isNaN(d1.getTime()))dateStr=d1.toISOString().split('T')[0];
      if(!dateStr){
        const p=dateRaw.split('/');
        if(p.length===3)dateStr=`${p[2].length===2?'20'+p[2]:p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;
      }
      if(!dateStr){
        const p=dateRaw.split('-');
        if(p.length===3&&p[0].length===4)dateStr=dateRaw;
      }
    }
    return{
      submitter:sub,date:dateStr,month:dateStr?dateStr.slice(0,7):null,
      isJack:isJack(sub),isLewis:isLewis(sub),
      follows:n(r[COLS.follows]),inbLeads:n(r[COLS.inbLeads]),qls:n(r[COLS.qls]),
      dms:n(r[COLS.dms]),convos:n(r[COLS.convos]),
      unqAppt:n(r[COLS.unqAppt]),qlAppt:n(r[COLS.qlAppt]),
      callsTaken:n(r[COLS.callsTaken]),callsClosed:n(r[COLS.callsClosed]),
      cashCollected:n(r[COLS.cashCollected]),revenue:n(r[COLS.revenue])
    };
  }).filter(r=>r.date);
}

function calcKPIs(rows,who){
  const f=who==='both'?rows:rows.filter(r=>who==='jack'?r.isJack:r.isLewis);
  const sum=k=>f.reduce((a,r)=>a+(r[k]||0),0);
  const follows=sum('follows'),inbLeads=sum('inbLeads'),qls=sum('qls'),
    dms=sum('dms'),convos=sum('convos'),unqAppt=sum('unqAppt'),qlAppt=sum('qlAppt');
  const dmConvo=dms>0?(convos/dms)*100:null;
  const totalBooked=unqAppt+qlAppt;
  const cr=rows.filter(r=>r.isJack||r.isLewis);
  const callsTaken=cr.reduce((a,r)=>a+(r.callsTaken||0),0);
  const callsClosed=cr.reduce((a,r)=>a+(r.callsClosed||0),0);
  const cashCollected=cr.reduce((a,r)=>a+(r.cashCollected||0),0);
  const revenue=cr.reduce((a,r)=>a+(r.revenue||0),0);
  const showPct=totalBooked>0?(callsTaken/totalBooked)*100:null;
  const convToCall=convos>0?(callsTaken/convos)*100:null;
  const closePct=callsTaken>0?(callsClosed/callsTaken)*100:null;
  return{follows,inbLeads,qls,dms,convos,unqAppt,qlAppt,dmConvo,convToCall,callsTaken,callsClosed,cashCollected,revenue,showPct,closePct,totalBooked};
}

function getMonths(){return[...new Set(allRows.map(r=>r.month).filter(Boolean))].sort();}
function getMonthsForPeriod(){
  const all=getMonths();if(!all.length)return[];
  if(period==='Month')return selMonth?[selMonth]:[all[all.length-1]];
  const n=period==='3M'?3:period==='6M'?6:period==='9M'?9:12;
  return all.slice(-n);
}
function rowsForPeriod(){const ms=getMonthsForPeriod();return allRows.filter(r=>ms.includes(r.month));}

function acctHTML(label,k,color){
  return`<div class="acard">
    <div class="atitle" style="border-left:3px solid ${color}">${label}</div>
    <div class="srow"><span class="sn">Follows</span><span class="sv">${fmt(k.follows)}</span></div>
    <div class="srow"><span class="sn">INB Leads</span><span class="sv">${fmt(k.inbLeads)}</span></div>
    <div class="srow"><span class="sn">QLs</span><span class="sv">${fmt(k.qls)}</span></div>
    <div class="srow"><span class="sn">DMs</span><span class="sv">${fmt(k.dms)}</span></div>
    <div class="srow"><span class="sn">DM → Convo %</span><span class="sv ${rag(k.dmConvo,'dmConvo')}">${fmt(k.dmConvo,'pct')}${dot(k.dmConvo,'dmConvo')}</span></div>
    <div class="srow"><span class="sn">Convos</span><span class="sv">${fmt(k.convos)}</span></div>
    <div class="srow"><span class="sn">Convo → Call %</span><span class="sv ${rag(k.convToCall,'convToCall')}">${fmt(k.convToCall,'pct')}${dot(k.convToCall,'convToCall')}</span></div>
    <div class="srow"><span class="sn">Unq Appt Set</span><span class="sv">${fmt(k.unqAppt)}</span></div>
    <div class="srow"><span class="sn">QL Appt Set</span><span class="sv">${fmt(k.qlAppt)}</span></div>
  </div>`;
}

function closingHTML(k){
  return`<div class="acard" style="margin-bottom:1.25rem">
    <div class="atitle" style="border-left:3px solid #7c6ef7">B2C Closing — combined</div>
    <div class="kgrid" style="margin-bottom:0">
      <div class="kcard"><div class="klabel">Call Show %</div><div class="kval ${rag(k.showPct,'showPct')}">${fmt(k.showPct,'pct')}${dot(k.showPct,'showPct')}</div></div>
      <div class="kcard"><div class="klabel">Calls Taken</div><div class="kval">${fmt(k.callsTaken)}</div></div>
      <div class="kcard"><div class="klabel">Close %</div><div class="kval ${rag(k.closePct,'closePct')}">${fmt(k.closePct,'pct')}${dot(k.closePct,'closePct')}</div></div>
      <div class="kcard"><div class="klabel">Calls Closed</div><div class="kval">${fmt(k.callsClosed)}</div></div>
      <div class="kcard"><div class="klabel">Cash Collected</div><div class="kval">${fmt(k.cashCollected,'gbp')}</div></div>
      <div class="kcard"><div class="klabel">Revenue</div><div class="kval">${fmt(k.revenue,'gbp')}</div></div>
    </div>
  </div>`;
}

function renderChart(id,labels,datasets){
  setTimeout(()=>{
    const ex=Chart.getChart(id);if(ex)ex.destroy();
    const el=document.getElementById(id);if(!el)return;
    new Chart(el,{type:'line',data:{labels,datasets},options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.isCurrency?'£'+ctx.parsed.y.toLocaleString():ctx.parsed.y}}},
      scales:{y:{ticks:{callback:v=>datasets[0]?.isCurrency?'£'+v.toLocaleString():v,font:{size:10}},grid:{color:'rgba(0,0,0,0.04)'}},x:{ticks:{font:{size:10}},grid:{display:false}}}
    }});
  },60);
}

function renderMain(){
  const main=document.getElementById('main');
  if(!allRows.length){
    main.innerHTML=`<div class="nodata">No form submissions yet.<br>Once Ollie, Harry, Jack and Lewis start submitting,<br>data will appear here automatically.</div>`;
    return;
  }
  const rows=rowsForPeriod();
  if(!rows.length){main.innerHTML=`<div class="nodata">No data for this period yet.</div>`;return;}

  if(period==='Day'){
    const dayRows=allRows.filter(r=>r.date===selDay);
    if(!dayRows.length){main.innerHTML=`<div class="nodata">No submissions for this date yet.</div>`;return;}
    const dj=calcKPIs(dayRows,'jack'),dl=calcKPIs(dayRows,'lewis'),da=calcKPIs(dayRows,'both');
    const dt=new Date(selDay+'T12:00:00');
    const dlabel=dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(view==='combined'){
      main.innerHTML=`<p class="slabel">${dlabel} — combined</p>
        <div class="kgrid">
          <div class="kcard"><div class="klabel">Follows</div><div class="kval">${fmt((dj.follows||0)+(dl.follows||0))}</div></div>
          <div class="kcard"><div class="klabel">DMs</div><div class="kval">${fmt((dj.dms||0)+(dl.dms||0))}</div></div>
          <div class="kcard"><div class="klabel">Convos</div><div class="kval">${fmt((dj.convos||0)+(dl.convos||0))}</div></div>
          <div class="kcard"><div class="klabel">Revenue</div><div class="kval">${fmt(da.revenue,'gbp')}</div></div>
          <div class="kcard"><div class="klabel">Cash Collected</div><div class="kval">${fmt(da.cashCollected,'gbp')}</div></div>
          <div class="kcard"><div class="klabel">Calls Closed</div><div class="kval">${fmt(da.callsClosed)}</div></div>
        </div>
        <hr class="hr"><p class="slabel">By account</p>
        <div class="twocol">${acctHTML("Jack",dj,'#378ADD')}${acctHTML("Lewis",dl,'#1D9E75')}</div>
        <hr class="hr">${closingHTML(da)}`;
    }else if(view==='jack'){
      main.innerHTML=`<p class="slabel">${dlabel} — Jack</p><div class="twocol">${acctHTML("Jack's account",dj,'#378ADD')}<div></div></div>`;
    }else if(view==='lewis'){
      main.innerHTML=`<p class="slabel">${dlabel} — Lewis</p><div class="twocol">${acctHTML("Lewis's account",dl,'#1D9E75')}<div></div></div>`;
    }else{
      main.innerHTML=`<p class="slabel">${dlabel} — B2C Closing</p>${closingHTML(da)}`;
    }
    return;
  }

  const jack=calcKPIs(rows,'jack'),lewis=calcKPIs(rows,'lewis'),all=calcKPIs(rows,'both');
  const months=getMonthsForPeriod();
  const mLabel=m=>new Date(m+'-15').toLocaleString('en-GB',{month:'short',year:'numeric'});
  const periodLabel=months.length===1?mLabel(months[0]):mLabel(months[0])+' – '+mLabel(months[months.length-1]);

  if(view==='combined'){
    const totDms=(jack.dms||0)+(lewis.dms||0),totConvos=(jack.convos||0)+(lewis.convos||0);
    const combinedDmC=totDms>0?(totConvos/totDms)*100:null;
    main.innerHTML=`
      <p class="slabel">${periodLabel} — combined</p>
      <div class="kgrid">
        <div class="kcard"><div class="klabel">Total Follows</div><div class="kval">${fmt((jack.follows||0)+(lewis.follows||0))}</div></div>
        <div class="kcard"><div class="klabel">Total DMs</div><div class="kval">${fmt(totDms)}</div></div>
        <div class="kcard"><div class="klabel">Convos Started</div><div class="kval">${fmt(totConvos)}</div></div>
        <div class="kcard"><div class="klabel">DM → Convo %</div><div class="kval ${rag(combinedDmC,'dmConvo')}">${fmt(combinedDmC,'pct')}${dot(combinedDmC,'dmConvo')}</div></div>
        <div class="kcard"><div class="klabel">Revenue</div><div class="kval">${fmt(all.revenue,'gbp')}</div></div>
        <div class="kcard"><div class="klabel">Cash Collected</div><div class="kval">${fmt(all.cashCollected,'gbp')}</div></div>
        <div class="kcard"><div class="klabel">Calls Closed</div><div class="kval">${fmt(all.callsClosed)}</div></div>
        <div class="kcard"><div class="klabel">Close %</div><div class="kval ${rag(all.closePct,'closePct')}">${fmt(all.closePct,'pct')}${dot(all.closePct,'closePct')}</div></div>
      </div>
      <hr class="hr"><p class="slabel">By account</p>
      <div class="twocol">${acctHTML("Jack",jack,'#378ADD')}${acctHTML("Lewis",lewis,'#1D9E75')}</div>
      <hr class="hr">${closingHTML(all)}
      ${months.length>1?`
      <p class="slabel">Monthly revenue trend</p>
      <div class="leg">
        <span class="li"><span class="ls" style="background:#7c6ef7"></span>Revenue</span>
        <span class="li"><span class="ls" style="background:#1D9E75"></span>Cash collected</span>
      </div>
      <div style="position:relative;height:200px;margin-bottom:1.5rem"><canvas id="trendC"></canvas></div>`:''}`;
    if(months.length>1){
      const revByMonth=months.map(m=>allRows.filter(r=>r.month===m).reduce((a,r)=>a+(r.revenue||0),0));
      const cashByMonth=months.map(m=>allRows.filter(r=>r.month===m).reduce((a,r)=>a+(r.cashCollected||0),0));
      renderChart('trendC',months.map(m=>new Date(m+'-15').toLocaleString('en-GB',{month:'short'})),[
        {label:'Revenue',data:revByMonth,borderColor:'#7c6ef7',backgroundColor:'rgba(124,110,247,0.06)',tension:0.3,pointRadius:3,borderWidth:2,isCurrency:true},
        {label:'Cash',data:cashByMonth,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,0.06)',tension:0.3,pointRadius:3,borderWidth:2,borderDash:[4,3],isCurrency:true}
      ]);
    }
  }else if(view==='jack'){
    main.innerHTML=`<p class="slabel">${periodLabel} — Jack</p><div class="twocol">${acctHTML("Jack's account",jack,'#378ADD')}<div></div></div>`;
  }else if(view==='lewis'){
    main.innerHTML=`<p class="slabel">${periodLabel} — Lewis</p><div class="twocol">${acctHTML("Lewis's account",lewis,'#1D9E75')}<div></div></div>`;
  }else{
    main.innerHTML=`<p class="slabel">${periodLabel} — B2C Closing</p>${closingHTML(all)}`;
  }
}

function buildControls(){
  const ptab=document.getElementById('periodTabs');
  ptab.innerHTML='';
  PERIODS.forEach(p=>{
    const t=document.createElement('div');
    t.className='tab'+(p===period?' active':'');
    t.textContent=p;
    t.onclick=()=>{
      period=p;
      document.querySelectorAll('#periodTabs .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      updateSecondaryControls();
      renderMain();
    };
    ptab.appendChild(t);
  });
  document.querySelectorAll('.vtab').forEach(t=>{
    t.onclick=()=>{
      view=t.dataset.v;
      document.querySelectorAll('.vtab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      renderMain();
    };
  });
  updateSecondaryControls();
}

function updateSecondaryControls(){
  document.getElementById('monthCtrlWrap')?.remove();
  document.getElementById('dayCtrlWrap')?.remove();
  const months=getMonths();
  if(!selMonth&&months.length)selMonth=months[months.length-1];
  if(period==='Month'||period==='Day'){
    const wrap=document.createElement('div');
    wrap.id='monthCtrlWrap';wrap.style.cssText='display:flex;gap:4px;align-items:center';
    const s=document.createElement('div');s.className='vsep';s.style.margin='0 4px';
    wrap.appendChild(s);
    months.forEach(m=>{
      const label=new Date(m+'-15').toLocaleString('en-GB',{month:'short',year:'2-digit'});
      const t=document.createElement('div');
      t.className='tab'+(m===selMonth?' active':'');
      t.style.fontSize='11px';t.textContent=label;
      t.onclick=()=>{
        selMonth=m;
        document.querySelectorAll('#monthCtrlWrap .tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        if(period==='Day')buildDaySelector();
        renderMain();
      };
      wrap.appendChild(t);
    });
    document.getElementById('row2').appendChild(wrap);
  }
  if(period==='Day')buildDaySelector();
}

function buildDaySelector(){
  document.getElementById('dayCtrlWrap')?.remove();
  const days=[...new Set(allRows.filter(r=>r.month===selMonth).map(r=>r.date))].sort();
  if(!days.length)return;
  if(!selDay||!days.includes(selDay))selDay=days[days.length-1];
  const wrap=document.createElement('div');
  wrap.id='dayCtrlWrap';wrap.style.cssText='display:flex;gap:6px;align-items:center';
  const s=document.createElement('div');s.className='vsep';s.style.margin='0 4px';
  const lbl=document.createElement('span');lbl.style.cssText='font-size:12px;color:#888';lbl.textContent='Date:';
  const sel=document.createElement('select');
  days.forEach(d=>{
    const o=document.createElement('option');
    o.value=d;o.textContent=new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    if(d===selDay)o.selected=true;
    sel.appendChild(o);
  });
  sel.onchange=e=>{selDay=e.target.value;renderMain();};
  wrap.appendChild(s);wrap.appendChild(lbl);wrap.appendChild(sel);
  document.getElementById('row2').appendChild(wrap);
}

async function loadData(){
  const badge=document.getElementById('statusBadge');
  badge.textContent='Loading...';badge.className='badge loading';
  try{
    const res=await fetch(PROXY_URL);
    const json=await res.json();
    const csvText=json.contents;
    const parsed=parseCSV(csvText);
    allRows=parseRows(parsed);
    const months=getMonths();
    if(months.length&&!selMonth)selMonth=months[months.length-1];
    badge.textContent=`Live — ${allRows.length} submission${allRows.length===1?'':'s'}`;
    badge.className='badge live';
    document.getElementById('lastUpdated').textContent='Last refreshed: '+new Date().toLocaleTimeString('en-GB');
    buildControls();
    renderMain();
  }catch(e){
    console.error(e);
    badge.textContent='Connection error';badge.className='badge err';
    document.getElementById('main').innerHTML=`<div class="nodata">Could not connect to Google Sheets.<br>Check your internet connection and try refreshing.<br><small style="color:#ccc">${e.message}</small></div>`;
  }
}

loadData();
</script>
</body>
</html>
